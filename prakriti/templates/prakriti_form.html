{% extends "base.html" %}
{% block content %}

<link rel="stylesheet" href="{{ url_for('prakriti.static', filename='style2.css') }}">

<div class="prakriti-container">

    <!-- 1. General Questions -->
    <!-- ================================================= -->

    <div class="question">
        <label>How would you describe your body build?</label>

            <option value="pitta">Medium / Muscular</option>
            <option value="kapha">Heavy / Well-built</option>

        <label>Do you gain or lose weight easily?</label>

            <option value="kapha">Gain weight easily</option>

    </div>
